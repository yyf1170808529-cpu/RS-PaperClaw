<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人科研论文库 · RS-PaperClaw</title>
<style>
:root{--bg:#f4efe7;--panel:#fffbf5;--line:rgba(58,43,28,.18);--text:#2d2419;--muted:#6a5a48;--accent:#b55f34}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Palatino Linotype","Noto Serif SC",serif;line-height:1.6}
main{max-width:1180px;margin:auto;padding:24px 20px}h1{margin:0}header{border-bottom:1px solid var(--line);padding-bottom:16px}a{color:var(--accent)}button,select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--text);padding:6px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}input[type=search]{flex:1;min-width:200px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.muted{color:var(--muted);font-size:.9rem}article{padding:16px 0;border-top:1px solid var(--line)}h2{font-size:1.12rem;margin:0 0 4px}summary{cursor:pointer}p{margin:8px 0}.abstract{white-space:pre-wrap}.analysis{white-space:pre-wrap;overflow-wrap:anywhere;max-height:600px;overflow:auto;background:var(--panel);padding:12px}textarea{width:100%;min-height:240px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.notice{color:var(--accent)}#message{min-height:1.5em}label{display:inline-flex;gap:5px;align-items:center}details{margin:8px 0}button:focus-visible,a:focus-visible{outline:2px solid var(--accent)}
</style></head>
<body><main>
<header><h1>个人科研论文库</h1><p>多模态感知 · 计算机视觉 · 目标关联 · 通用方法</p>
<p class="muted">基于 RS-PaperClaw。收藏、笔记和阅读记录仅保存在当前浏览器。Safari、Chrome、应用内浏览器及不同设备默认不共享；请用同一浏览器打开，或导出/导入 JSON。</p>
<nav><a href="maritime-daily.html">每日精选</a> | <a href="maritime.html">完整论文库</a></nav><a href="index.html">原遥感页面</a> · <a href="https://chatgpt.com/" target="_blank" rel="noreferrer">打开 ChatGPT</a> · <a href="https://chat.deepseek.com/" target="_blank" rel="noreferrer">打开 DeepSeek</a></header>
<section class="toolbar" aria-label="筛选">
<label>阅读范围<select id="window"><option value="recent">近期精选（水上90天／陆上30天／通用30天）</option><option value="today">今日新发现</option><option value="7">最近7天重点推荐（水上90天）</option><option value="14">最近14天重点推荐（水上90天）</option><option value="history">全部已收录论文</option><option value="favorites">我的收藏</option></select></label>
<label>日期<select id="date"><option value="">全部日期 / 最新列表</option></select></label>
<label>专题<select id="topic"><option value="">全部专题</option></select></label>
<label>应用方向<select id="bucket"><option value="">全部方向</option><option value="water">水路</option><option value="land">陆上交通</option><option value="general">通用方法</option><option value="other">其他</option></select></label>
<label>相关性<select id="level"><option value="">全部入选</option><option value="high">高度相关</option><option value="transfer">方法可借鉴</option><option value="general">一般相关</option><option value="excluded">不相关候选</option></select></label>
<label>排序<select id="sort"><option value="score">相关性优先</option><option value="date">最新发布</option></select></label>
<label>期刊门槛<select id="quality"><option value="">全部来源</option><option value="high_journal">全部高水平期刊（OR）</option><option value="cas_one">中科院一区</option><option value="jcr_q1">JCR JIF Q1</option><option value="both">同时一区</option><option value="unverified">分区待核验</option></select></label>
<label>摘要<select id="language"><option value="both">中英对照</option><option value="zh">中文</option><option value="en">English</option></select></label>
<input id="search" type="search" placeholder="搜索标题、摘要、关键词、作者" aria-label="搜索论文"></section>
<section id="favorite-tools" class="toolbar" aria-label="收藏导出与恢复"></section><p id="favorites-status" class="muted"></p>
<section class="toolbar"><button id="export">导出 JSON 备份</button><label>导入 JSON 备份<input id="import" type="file" accept=".json"></label><span id="summary" class="muted"></span><a id="report" hidden>查看 Markdown 日报</a></section>
<p id="message" role="status" aria-live="polite"></p><details id="update-details" hidden><summary>查看更新详情</summary><p id="update-detail-text" class="muted"></p></details><section id="papers" aria-label="论文列表"></section>
</main><script src="maritime_favorites.js?v=3.7.2"></script><script src="maritime.js?v=3.7.2"></script></body></html>
