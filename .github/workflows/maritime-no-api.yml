name: Personal Papers (No LLM API)
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional replay date YYYYMMDD'
        type: string
      bootstrap:
        description: 'First maritime journal search: backfill 12 months'
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: maritime-no-api
  cancel-in-progress: false
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      INPUT_DATE: ${{ inputs.date }}
      INPUT_BOOTSTRAP: ${{ inputs.bootstrap || false }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/papers/previews/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-API regression tests
        run: python -m unittest discover -s tests -p 'test_maritime*.py'
      - name: Install optional CPU translation
        continue-on-error: true
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r skills/rs-paper-pipeline/requirements-translation.txt
      - uses: actions/cache@v4
        with:
          path: papers/maritime/private/translation
          key: argos-en-zh-v3-${{ hashFiles('skills/rs-paper-pipeline/requirements-translation.txt') }}
      - name: Prepare translation model (reuse cache)
        id: translation_model
        continue-on-error: true
        run: |
          set -o pipefail
          python skills/rs-paper-pipeline/scripts/cli.py maritime --action install-model 2>&1 | tee argos-setup.log
      - name: Report unavailable local translation model
        if: steps.translation_model.outcome == 'failure'
        run: echo '::warning::Argos model preparation failed. See argos-setup.log; selected-paper translation will retain English and record per-paper errors.'
      - name: Environment check
        run: python skills/rs-paper-pipeline/scripts/cli.py maritime --action doctor
      - uses: actions/cache/restore@v4
        id: ai_usage
        with:
          path: |
            papers/maritime/private/deepseek/usage.json
          key: daily-deepseek-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-deepseek-${{ github.repository_id }}-
      - name: Retrieve all sources and build
        id: retrieve
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [[ -n "$INPUT_DATE" ]]; then args=(--date "$INPUT_DATE"); fi
          if [[ "$INPUT_BOOTSTRAP" == 'true' ]]; then args+=(--bootstrap); fi
          python skills/rs-paper-pipeline/scripts/cli.py maritime --action update --timeout 30 --retries 2 --max-pages 5 "${args[@]}" > maritime-run.log 2>&1
          cat maritime-run.log
      - name: Protect last complete daily selection before sync
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import date, datetime
          from pathlib import Path
          sys.path.insert(0, 'skills/rs-paper-pipeline/scripts')
          from services.mobile_digest import build_mobile_digest
          root = Path('.')
          raw = os.environ.get('INPUT_DATE')
          day = date.fromisoformat(raw) if raw and '-' in raw else datetime.strptime(raw, '%Y%m%d').date() if raw else date.today()
          result = build_mobile_digest(root, json.loads((root/'papers/maritime/library.json').read_text(encoding='utf8')), day)
          print('Daily attempt:', result['publication_status'], 'selected:', len(result['papers']), 'published date:', result['published_date'])
          PY
      - name: Commit static archives to this repository
        id: sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python skills/rs-paper-pipeline/scripts/update_maritime.py --sync-only --no-open
      - name: Report incomplete source update
        if: steps.retrieve.outcome == 'failure'
        run: |
          echo 'Source update failed or was incomplete. Successful batches were preserved and sync was attempted; inspect logs.'
          exit 1
      - name: Preserve logs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maritime-run-logs
          path: |
            maritime-run.log
            argos-setup.log
            papers/maritime/logs/
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: papers/maritime/private/deepseek/usage.json
          key: ${{ steps.ai_usage.outputs.cache-primary-key }}
      - name: Preserve generated archives if sync was stopped
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maritime-pending-archives
          path: |
            papers/maritime/library.json
            daily_reports/maritime/
            docs/maritime-data/
            docs/maritime-daily.html
          retention-days: 14
