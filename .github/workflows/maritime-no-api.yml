name: Personal Papers (No LLM API)
run-name: Paper update ${{ inputs.request_id || github.event_name }}
on:
  schedule:
    - cron: '20 1 * * *'
    - cron: '20 7 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: Desktop request identity
        type: string
      resume:
        description: Resume AI/translation/publication without fetching sources
        type: boolean
        default: false
      date:
        description: 'Optional replay date YYYYMMDD'
        type: string
      bootstrap:
        description: 'First maritime journal search: backfill 12 months'
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: maritime-no-api
  cancel-in-progress: false
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      RS_RESUME_ONLY: ${{ (inputs.resume || github.event.schedule == '20 7 * * *') && '1' || '0' }}
      INPUT_DATE: ${{ inputs.date }}
      INPUT_BOOTSTRAP: ${{ inputs.bootstrap || false }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/papers/previews/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-API regression tests
        run: python -m unittest discover -s tests -p 'test_maritime*.py'
      - name: Install optional CPU translation
        continue-on-error: true
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r skills/rs-paper-pipeline/requirements-translation.txt
      - uses: actions/cache@v4
        with:
          path: papers/maritime/private/translation
          key: argos-en-zh-v4-${{ hashFiles('skills/rs-paper-pipeline/requirements-translation.txt') }}
          restore-keys: |
            argos-en-zh-v4-
            argos-en-zh-v3-
      - name: Prepare translation model (reuse cache)
        id: translation_model
        continue-on-error: true
        run: |
          set -o pipefail
          python skills/rs-paper-pipeline/scripts/cli.py maritime --action install-model 2>&1 | tee argos-setup.log
          python -c "import sys;sys.path.insert(0,'skills/rs-paper-pipeline/scripts');from services.maritime_reading import translation_smoke;print(translation_smoke())" 2>&1 | tee -a argos-setup.log
      - name: Report unavailable local translation model
        if: steps.translation_model.outcome == 'failure'
        run: echo '::warning::Argos model preparation failed. See argos-setup.log; selected-paper translation will retain English and record per-paper errors.'
      - name: Environment check
        run: python skills/rs-paper-pipeline/scripts/cli.py maritime --action doctor
      - uses: actions/cache/restore@v4
        id: ai_usage
        with:
          path: |
            papers/maritime/private/deepseek/usage.json
          key: daily-deepseek-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-deepseek-${{ github.repository_id }}-
      - name: Find unsynced results from last completed update
        id: recovery
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'
          def get(path):
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=25) as response:return json.load(response)
          runs=get('actions/workflows/maritime-no-api.yml/runs?status=completed&per_page=1')['workflow_runs']
          if runs and runs[0]['conclusion']!='success':
              artifacts=get('actions/runs/'+str(runs[0]['id'])+'/artifacts')['artifacts']
              if any(a['name']=='maritime-pending-archives' and not a['expired'] for a in artifacts):
                  with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('run_id='+str(runs[0]['id'])+'\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.recovery.outputs.run_id != ''
        with:
          name: maritime-pending-archives
          path: papers/maritime/private/recovery
          github-token: ${{ github.token }}
          run-id: ${{ steps.recovery.outputs.run_id }}
      - name: Merge unsynced results without replacing current data
        if: steps.recovery.outputs.run_id != ''
        run: |
          python -c "import sys;sys.path.insert(0,'skills/rs-paper-pipeline/scripts');from pathlib import Path;from services.cloud_recovery import restore;print(restore(Path('.'),Path('papers/maritime/private/recovery')))"
      - name: Retrieve all sources and build
        id: retrieve
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [[ -n "$INPUT_DATE" ]]; then args=(--date "$INPUT_DATE"); fi
          if [[ "$INPUT_BOOTSTRAP" == 'true' ]]; then args+=(--bootstrap); fi
          python skills/rs-paper-pipeline/scripts/cli.py maritime --action update --timeout 30 --retries 2 --max-pages 5 "${args[@]}" > maritime-run.log 2>&1
          cat maritime-run.log
      - name: Protect last complete daily selection before sync
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import date, datetime
          from pathlib import Path
          sys.path.insert(0, 'skills/rs-paper-pipeline/scripts')
          from services.mobile_digest import build_mobile_digest
          from services.maritime import today
          root = Path('.')
          raw = os.environ.get('INPUT_DATE')
          day = date.fromisoformat(raw) if raw and '-' in raw else datetime.strptime(raw, '%Y%m%d').date() if raw else today()
          result = build_mobile_digest(root, json.loads((root/'papers/maritime/library.json').read_text(encoding='utf8')), day)
          print('Daily attempt:', result['publication_status'], 'selected:', len(result['papers']), 'published date:', result['published_date'])
          PY
      - name: Commit static archives to this repository
        id: sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python skills/rs-paper-pipeline/scripts/update_maritime.py --sync-only --no-open
      - name: Report incomplete source update
        if: steps.retrieve.outcome == 'failure'
        run: |
          echo 'Source update failed or was incomplete. Successful batches were preserved and sync was attempted; inspect logs.'
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/maritime-data/mobile/publication-status.json')
          status=json.loads(p.read_text()) if p.exists() else {}
          summary=json.loads(Path('papers/maritime/logs/latest-update.json').read_text())
          raise SystemExit(0 if status.get('status')=='complete' and not summary.get('translation_failed') else 1)
          PY
      - name: Preserve logs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maritime-run-logs
          path: |
            maritime-run.log
            argos-setup.log
            papers/maritime/logs/
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: papers/maritime/private/deepseek/usage.json
          key: ${{ steps.ai_usage.outputs.cache-primary-key }}
      - name: Preserve generated archives if sync was stopped
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maritime-pending-archives
          path: |
            papers/maritime/library.json
            daily_reports/maritime/
            docs/maritime-data/
            docs/maritime-daily.html
          retention-days: 14
