name: Publish personal reading page
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/maritime-pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Personal Papers (No LLM API)']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: maritime-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deploy
